name: tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv run python -m benchmarks.validate
      - run: uv run python run_eval.py --agent react --benchmark custom --task-limit 2 --estimate-only --config configs/experiments/pilot.yaml
