name: pilot
benchmark_version: v1.0
model: gpt-4o-mini
development_model: gpt-4o-mini
primary_model: gpt-4o
default_model_role: development
temperature: 0.0
max_output_tokens: 512
agents: [react, plan_execute, langgraph, direct]
frameworks: [langgraph]
benchmarks: [custom, gaia_style]
tools: [calculator, python, search, retrieve, read_file]
split: dev
task_limit: 15
repeats: 5
parallelism: 1
retries: 1
budgets:
  max_steps: 8
  max_tokens: 4000
  max_seconds: 60
cache:
  enabled: true
spend_cap_usd: 5.0
pricing_per_million_tokens:
  gpt-4o-mini: [0.15, 0.60]
  gpt-4o: [2.50, 10.00]
judge:
  model: gpt-4o
  temperature: 0.0
  votes: 3
reflection:
  enabled: false
  max_cycles: 2
